name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg build-essential cmake git
      - name: Build whisper.cpp (same version as Dockerfile.worker)
        run: |
          git clone --depth 1 --branch v1.9.2 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -B /tmp/whisper.cpp/build -S /tmp/whisper.cpp
          cmake --build /tmp/whisper.cpp/build --config Release -j "$(nproc)"
          sudo cp /tmp/whisper.cpp/build/bin/whisper-cli /usr/local/bin/whisper-cli
      - name: Fetch tiny whisper model (plumbing test only, not the small model the worker runs)
        run: |
          mkdir -p models
          curl -L -o models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Set up backend venv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Install frontend deps and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: frontend
        env:
          E2E_START_MONGO: "false"
          E2E_MONGO_PORT: "27017"
        run: npm run test:e2e
